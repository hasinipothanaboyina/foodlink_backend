<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | FoodLink AI</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Lora:ital,wght@0,500;0,700;1,500&display=swap" rel="stylesheet">
</head>
<body>
    <nav class="navbar glass" id="navbar">
        <a href="index.html" class="logo">
            <svg class="logo-icon" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M10 50 C10 80, 90 80, 90 50" stroke="var(--primary)" stroke-width="8" stroke-linecap="round"/>
                <path d="M35 40 Q30 20 40 10" stroke="var(--secondary)" stroke-width="6" stroke-linecap="round" fill="none"/>
                <path d="M55 45 Q50 25 60 15" stroke="var(--secondary)" stroke-width="6" stroke-linecap="round" fill="none"/>
                <path d="M75 35 Q70 15 80 5" stroke="var(--secondary)" stroke-width="6" stroke-linecap="round" fill="none"/>
            </svg>
            FoodLink
        </a>
    </nav>

    <div style="min-height:100vh; display:flex; align-items:center; justify-content:center; padding:6rem 5% 4rem;">
        <div class="card reveal" style="width:100%; max-width:420px; text-align:center;">

            <!-- Invalid/Expired token state -->
            <div id="invalidStep" style="display:none;">
                <i class="fa-solid fa-circle-xmark" style="font-size:3rem; color:#f43f5e; margin-bottom:1rem;"></i>
                <h2 style="margin-bottom:0.75rem;">Link Expired</h2>
                <p style="color:var(--text-muted); margin-bottom:2rem;">
                    This reset link is invalid or has expired. Reset links are only valid for 1 hour.
                </p>
                <a href="forgot-password.html" class="btn btn-primary" style="width:100%; justify-content:center;">
                    <i class="fa-solid fa-rotate-right"></i> Request New Link
                </a>
            </div>

            <!-- Reset form -->
            <div id="resetStep">
                <i class="fa-solid fa-lock-open" style="font-size:2.5rem; color:var(--primary); margin-bottom:1rem;"></i>
                <h2 style="margin-bottom:0.5rem;">Set New Password</h2>
                <p style="color:var(--text-muted); margin-bottom:2rem; font-size:0.95rem;">
                    Enter a new password for your account.
                </p>

                <div class="form-group" style="text-align:left;">
                    <label>New Password</label>
                    <input type="password" id="newPassword" class="form-control"
                        placeholder="At least 6 characters">
                    <p id="passwordError" style="color:#f43f5e; font-size:0.82rem; margin-top:0.3rem; display:none;"></p>
                </div>

                <div class="form-group" style="text-align:left;">
                    <label>Confirm New Password</label>
                    <input type="password" id="confirmPassword" class="form-control"
                        placeholder="Re-enter new password">
                    <p id="confirmError" style="color:#f43f5e; font-size:0.82rem; margin-top:0.3rem; display:none;"></p>
                </div>

                <!-- Password strength indicator -->
                <div id="strengthBar" style="height:4px; border-radius:999px; background:var(--border); margin-bottom:1.5rem; transition:all 0.3s;">
                    <div id="strengthFill" style="height:100%; border-radius:999px; width:0%; transition:all 0.3s;"></div>
                </div>

                <button id="resetBtn" class="btn btn-primary" style="width:100%; justify-content:center; padding:1rem;">
                    <i class="fa-solid fa-key"></i> Reset Password
                </button>
            </div>

            <!-- Success state -->
            <div id="successStep" style="display:none;">
                <i class="fa-solid fa-circle-check" style="font-size:3rem; color:#10b981; margin-bottom:1rem;"></i>
                <h2 style="margin-bottom:0.75rem;">Password Reset!</h2>
                <p style="color:var(--text-muted); margin-bottom:2rem;">
                    Your password has been updated successfully. You can now log in with your new password.
                </p>
                <a href="auth.html" class="btn btn-primary" style="width:100%; justify-content:center;">
                    <i class="fa-solid fa-arrow-right-to-bracket"></i> Login Now
                </a>
            </div>

        </div>
    </div>

    <script>
        const API_BASE = window.location.protocol === 'file:' ? 'http://localhost:5000/api' : '/api';

        // Read token and email from URL
        const params = new URLSearchParams(window.location.search);
        const token = params.get('token');
        const email = params.get('email');

        if (!token || !email) {
            document.getElementById('resetStep').style.display = 'none';
            document.getElementById('invalidStep').style.display = 'block';
        }

        // Password strength indicator
        document.getElementById('newPassword').addEventListener('input', function () {
            const val = this.value;
            const fill = document.getElementById('strengthFill');
            let strength = 0;
            if (val.length >= 6) strength++;
            if (val.length >= 10) strength++;
            if (/[A-Z]/.test(val)) strength++;
            if (/[0-9]/.test(val)) strength++;
            if (/[^A-Za-z0-9]/.test(val)) strength++;

            const colors = ['#f43f5e', '#f59e0b', '#f59e0b', '#10b981', '#10b981'];
            const widths = ['20%', '40%', '60%', '80%', '100%'];
            fill.style.width = widths[strength - 1] || '0%';
            fill.style.background = colors[strength - 1] || 'transparent';
        });

        document.getElementById('resetBtn').addEventListener('click', async () => {
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const passwordError = document.getElementById('passwordError');
            const confirmError = document.getElementById('confirmError');

            passwordError.style.display = 'none';
            confirmError.style.display = 'none';

            if (!newPassword || newPassword.length < 6) {
                passwordError.textContent = 'Password must be at least 6 characters.';
                passwordError.style.display = 'block';
                return;
            }

            if (newPassword !== confirmPassword) {
                confirmError.textContent = 'Passwords do not match.';
                confirmError.style.display = 'block';
                return;
            }

            const resetBtn = document.getElementById('resetBtn');
            resetBtn.disabled = true;
            resetBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Resetting...';

            try {
                const res = await fetch(`${API_BASE}/auth/reset-password`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, token, newPassword })
                });
                const data = await res.json();

                if (res.ok) {
                    document.getElementById('resetStep').style.display = 'none';
                    document.getElementById('successStep').style.display = 'block';
                } else if (res.status === 400 && data.message.includes('expired')) {
                    document.getElementById('resetStep').style.display = 'none';
                    document.getElementById('invalidStep').style.display = 'block';
                } else {
                    passwordError.textContent = data.message || 'Something went wrong.';
                    passwordError.style.display = 'block';
                    resetBtn.disabled = false;
                    resetBtn.innerHTML = '<i class="fa-solid fa-key"></i> Reset Password';
                }
            } catch (err) {
                passwordError.textContent = 'Cannot connect to server.';
                passwordError.style.display = 'block';
                resetBtn.disabled = false;
                resetBtn.innerHTML = '<i class="fa-solid fa-key"></i> Reset Password';
            }
        });

        document.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => document.querySelector('.reveal')?.classList.add('active'), 100);
        });
    </script>
</body>
</html>
