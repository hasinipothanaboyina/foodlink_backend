<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Volunteer Dashboard | FoodLink AI</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
        (function () {
            const token = localStorage.getItem('foodlink_token');
            if (!token) window.location.href = 'auth.html';
        })();
    </script>
</head>
<body>
    <nav class="navbar glass">
        <a href="index.html" class="logo">
            <svg class="logo-icon" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M10 50 C10 80, 90 80, 90 50" stroke="var(--primary)" stroke-width="8" stroke-linecap="round"/>
                <path d="M35 40 Q30 20 40 10" stroke="var(--secondary)" stroke-width="6" stroke-linecap="round" fill="none"/>
                <path d="M55 45 Q50 25 60 15" stroke="var(--secondary)" stroke-width="6" stroke-linecap="round" fill="none"/>
                <path d="M75 35 Q70 15 80 5" stroke="var(--secondary)" stroke-width="6" stroke-linecap="round" fill="none"/>
            </svg>
            FoodLink
        </a>
        <div class="nav-links" style="display: flex; gap: 1rem; align-items: center;">
            <a href="#" id="logoutBtn" class="btn btn-outline" style="padding: 0.4rem 1rem; font-size: 0.85rem;"><i class="fa-solid fa-power-off"></i> Logout</a>
        </div>
    </nav>

    <div class="page-container" style="margin-top: 100px;">
        <h2 style="margin-bottom: 1rem;">Volunteer Dashboard (Food Rescuer)</h2>
        <p style="color: var(--text-muted); margin-bottom: 2rem;">Help deliver surplus food to NGOs. Claim a pickup below to start your route.</p>

        <div id="loading" style="text-align: center; color: var(--text-muted);"><i class="fa-solid fa-spinner fa-spin"></i> Loading pending pickups...</div>
        
        <div id="pickupsGrid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 1.5rem;">
            <!-- Pickups rendered here -->
        </div>
    </div>

    <script src="script.js"></script>
    <script>
        async function loadPickups() {
            const grid = document.getElementById('pickupsGrid');
            const loader = document.getElementById('loading');
            
            try {
                const data = await apiCall('/volunteers/pending');
                loader.style.display = 'none';
                
                if (data.pickups.length === 0) {
                    grid.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: var(--text-muted);">No pending pickups right now! You are all caught up.</p>';
                    return;
                }

                grid.innerHTML = data.pickups.map(p => `
                    <div style="background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 1.5rem; box-shadow: var(--shadow-sm);">
                        <div style="display:flex; justify-content:space-between; align-items:start; margin-bottom: 1rem;">
                            <h3 style="margin:0; font-size: 1.1rem;"><i class="fa-solid fa-box"></i> ${p.quantity}x ${p.food_type}</h3>
                            ${p.is_urgent ? '<span style="background: rgba(244,63,94,0.1); color: #f43f5e; padding: 0.2rem 0.6rem; border-radius: 999px; font-size: 0.75rem; font-weight: 700;">URGENT</span>' : ''}
                        </div>
                        <div style="margin-bottom: 1rem;">
                            <p style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 0.3rem;"><strong>Pick up from:</strong></p>
                            <p style="font-size: 0.95rem; margin-bottom: 0.2rem;">${p.donor_address}</p>
                            <p style="font-size: 0.85rem; color: var(--text-muted);"><i class="fa-solid fa-phone"></i> ${p.donor_phone}</p>
                        </div>
                        <div style="margin-bottom: 1.5rem; padding-top: 1rem; border-top: 1px dashed var(--border);">
                            <p style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 0.3rem;"><strong>Deliver to:</strong></p>
                            <p style="font-size: 0.95rem; margin-bottom: 0.2rem;">${p.ngo_name}</p>
                            <p style="font-size: 0.85rem; color: var(--text-muted);">${p.ngo_address}, ${p.city}</p>
                        </div>
                        <button class="btn btn-primary claim-btn" data-id="${p.request_id}" style="width: 100%; justify-content: center;">
                            <i class="fa-solid fa-truck-fast"></i> Claim Pickup
                        </button>
                    </div>
                `).join('');

                document.querySelectorAll('.claim-btn').forEach(btn => {
                    btn.addEventListener('click', async (e) => {
                        const id = e.target.closest('button').dataset.id;
                        btn.disabled = true;
                        btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Claiming...';
                        try {
                            const res = await apiCall(`/volunteers/claim/${id}`, 'PATCH');
                            alert(res.message);
                            loadPickups();
                        } catch (err) {
                            alert(err.message || 'Failed to claim');
                            btn.disabled = false;
                            btn.innerHTML = '<i class="fa-solid fa-truck-fast"></i> Claim Pickup';
                        }
                    });
                });
            } catch (e) {
                loader.textContent = 'Failed to load pickups. Are you registered as a Volunteer?';
            }
        }

        document.getElementById('logoutBtn').addEventListener('click', (e) => {
            e.preventDefault();
            localStorage.clear();
            window.location.href = 'index.html';
        });

        loadPickups();
    </script>
</body>
</html>
