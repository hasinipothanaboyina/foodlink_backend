<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NGO & Admin Login | FoodLink AI</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Lora:ital,wght@0,500;0,700;1,500&display=swap" rel="stylesheet">
    <style>
        .auth-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 6rem 5% 4rem;
        }
    </style>
</head>
<body>
    <nav class="navbar glass" id="navbar">
        <a href="index.html" class="logo">
            <svg class="logo-icon" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M10 50 C10 80, 90 80, 90 50" stroke="var(--primary)" stroke-width="8" stroke-linecap="round"/>
                <path d="M35 40 Q30 20 40 10" stroke="var(--secondary)" stroke-width="6" stroke-linecap="round" fill="none"/>
                <path d="M55 45 Q50 25 60 15" stroke="var(--secondary)" stroke-width="6" stroke-linecap="round" fill="none"/>
                <path d="M75 35 Q70 15 80 5" stroke="var(--secondary)" stroke-width="6" stroke-linecap="round" fill="none"/>
            </svg>
            FoodLink
        </a>
        <div class="nav-links">
            <a href="index.html" style="font-size:0.9rem; color:var(--text-muted);">
                <i class="fa-solid fa-arrow-left"></i> Back to Home
            </a>
        </div>
    </nav>

    <div class="auth-container">
        <div class="card reveal" style="width:100%; max-width:400px; text-align:center;">
            <i class="fa-solid fa-lock" style="font-size:2rem; color:var(--primary); margin-bottom:1rem;"></i>
            <h2 style="margin-bottom:0.5rem;">NGO & Admin Login</h2>
            <p style="color:var(--text-muted); margin-bottom:2rem; font-size:0.95rem;">
                Sign in to manage your organisation and monitor donations.
            </p>

            <!-- Error banner -->
            <div id="loginError" style="display:none; background:rgba(244,63,94,0.08); border:1px solid rgba(244,63,94,0.3); border-radius:var(--radius-md); padding:0.75rem 1rem; margin-bottom:1.5rem; color:#f43f5e; font-size:0.87rem; text-align:left;">
                <i class="fa-solid fa-circle-exclamation"></i> <span id="loginErrorText"></span>
            </div>

            <div style="text-align:left;">
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="email" class="form-control" placeholder="your@email.com" required>
                </div>

                <div class="form-group">
                    <label>Password</label>
                    <div style="position:relative;">
                        <input type="password" id="password" class="form-control"
                            placeholder="••••••••" required style="padding-right:3rem;">
                        <button type="button" id="togglePassword"
                            style="position:absolute; right:1rem; top:50%; transform:translateY(-50%); background:none; border:none; cursor:pointer; color:var(--text-muted); font-size:0.9rem;">
                            <i class="fa-solid fa-eye"></i>
                        </button>
                    </div>
                </div>

                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1.5rem; font-size:0.85rem;">
                    <label style="display:flex; align-items:center; gap:0.5rem; font-weight:normal; margin:0; cursor:pointer;">
                        <input type="checkbox" id="rememberMe"> Remember me
                    </label>
                    <a href="forgot-password.html" style="color:var(--primary); text-decoration:none; font-weight:500;">
                        Forgot Password?
                    </a>
                </div>

                <button id="loginBtn" class="btn btn-primary" style="width:100%; justify-content:center; margin-bottom:1rem; padding:1rem;">
                    Sign In <i class="fa-solid fa-arrow-right"></i>
                </button>

                <div style="text-align:center; font-size:0.9rem; color:var(--text-muted);">
                    Don't have an account?
                    <a href="ngo-register.html" style="color:var(--primary); text-decoration:none; font-weight:600;">
                        Register NGO
                    </a>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
    <script>

        // Password show/hide
        document.getElementById('togglePassword').addEventListener('click', () => {
            const input = document.getElementById('password');
            const icon = document.querySelector('#togglePassword i');
            if (input.type === 'password') {
                input.type = 'text';
                icon.className = 'fa-solid fa-eye-slash';
            } else {
                input.type = 'password';
                icon.className = 'fa-solid fa-eye';
            }
        });

        // Login submit
        document.getElementById('loginBtn').addEventListener('click', async () => {
            const email    = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('loginError');
            const errorText = document.getElementById('loginErrorText');
            const btn      = document.getElementById('loginBtn');

            errorDiv.style.display = 'none';

            if (!email || !password) {
                errorText.textContent = 'Please enter both email and password.';
                errorDiv.style.display = 'block';
                return;
            }

            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Signing in...';

            try {
                const res  = await fetch(`${API_BASE}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await res.json();

                if (res.ok && data.token) {
                    localStorage.setItem('foodlink_token', data.token);
                    localStorage.setItem('foodlink_user', JSON.stringify(data.user));

                    // Redirect based on role
                    if (data.user.role === 'admin') {
                        window.location.href = 'admin.html';
                    } else if (data.user.role === 'ngo') {
                        window.location.href = 'dashboard.html';
                    } else {
                        window.location.href = 'my-donations.html';
                    }
                } else {
                    errorText.textContent = data.message || 'Invalid email or password.';
                    errorDiv.style.display = 'block';
                    btn.disabled = false;
                    btn.innerHTML = 'Sign In <i class="fa-solid fa-arrow-right"></i>';
                }
            } catch (err) {
                errorText.textContent = 'Cannot connect to server. Make sure your backend is running.';
                errorDiv.style.display = 'block';
                btn.disabled = false;
                btn.innerHTML = 'Sign In <i class="fa-solid fa-arrow-right"></i>';
            }
        });

        // Enter key support
        document.getElementById('password').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') document.getElementById('loginBtn').click();
        });

        // Reveal animation
        document.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => document.querySelector('.reveal')?.classList.add('active'), 100);
        });
    </script>
</body>
</html>
