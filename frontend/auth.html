<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | FoodLink AI</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <nav class="navbar glass">
        <a href="index.html" class="logo">
            <i class="fa-solid fa-leaf"></i> FoodLink
        </a>
    </nav>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <h2>Welcome Back</h2>
                <p style="color: var(--text-muted);">Sign in to continue your impact</p>
            </div>
            
            <form id="loginForm">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" class="form-control" placeholder="name@example.com" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" class="form-control" placeholder="••••••••" required>
                </div>
                
                <div style="display: flex; justify-content: space-between; margin-bottom: 1.5rem; font-size: 0.9rem;">
                    <label style="display: flex; align-items: center; gap: 0.5rem; font-weight: 400;">
                        <input type="checkbox"> Remember me
                    </label>
                    <a href="#" style="color: var(--primary); font-weight: 500;">Forgot Password?</a>
                </div>
                <button type="submit" class="btn btn-primary btn-block">
                    Sign In <i class="fa-solid fa-arrow-right"></i>
                </button>
            </form>
            <div class="auth-footer">
                <p>Don't have an account? <a href="#">Create Account</a></p>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
