<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NGO Partners | FoodLink AI</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <nav class="navbar glass" style="padding: 0.8rem 5%;">
        <a href="index.html" class="logo">
            <i class="fa-solid fa-leaf"></i> FoodLink
        </a>
        <div class="nav-links">
            <div class="user-profile" style="display: flex; align-items: center; gap: 0.5rem; font-weight: 500;">
                <div style="width: 35px; height: 35px; border-radius: 50%; background: var(--primary); color: white; display: flex; align-items: center; justify-content: center;">JD</div>
                John's Bakery
            </div>
        </div>
    </nav>
    <div class="dashboard-layout">
        <aside class="sidebar" id="sidebar">
            <ul class="sidebar-menu">
                <li><a href="dashboard.html"><i class="fa-solid fa-chart-line"></i> Analytics</a></li>
                <li><a href="my-donations.html"><i class="fa-solid fa-box-open"></i> My Donations</a></li>
                <li><a href="ngo-partners.html" class="active"><i class="fa-solid fa-handshake"></i> NGO Partners</a></li>
                <li><a href="#" id="notificationsLink"><i class="fa-solid fa-bell"></i> Notifications <span id="notifCountBadge" style="background: var(--primary); color: white; padding: 2px 6px; border-radius: 10px; font-size: 0.7rem; margin-left: auto; display:none;">0</span></a></li>
                <li style="margin-top: 2rem;"><a href="donate.html" class="btn btn-primary" style="color: white; justify-content: center;"><i class="fa-solid fa-plus"></i> New Donation</a></li>
            </ul>
        </aside>
        <main class="main-content">
            <div class="dashboard-header">
                <div>
                    <h2>NGO Partners</h2>
                    <p style="color: var(--text-muted);" id="ngoSubtitle">All NGOs registered on FoodLink AI.</p>
                </div>
                <button id="findNearMeBtn" class="btn btn-outline">
                    <i class="fa-solid fa-location-crosshairs"></i> Sort by Distance from Me
                </button>
            </div>

            <!-- City filter -->
            <div style="display: flex; gap: 1rem; align-items: center; margin-bottom: 1.5rem; flex-wrap: wrap;">
                <label for="cityFilter" style="font-weight: 500; color: var(--text-muted);">Filter by city:</label>
                <select id="cityFilter" class="form-control" style="max-width: 220px;">
                    <option value="all">All Cities</option>
                </select>
            </div>

            <div id="ngoCardsGrid" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 1.5rem;">
                <p style="color: var(--text-muted);">Loading NGO partners...</p>
            </div>
        </main>
    </div>

    <!-- Notifications Dropdown Panel -->
    <div id="notificationsPanel" style="display:none; position: fixed; top: 80px; left: 300px; width: 340px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-md); box-shadow: var(--shadow-lg); z-index: 1500; max-height: 400px; overflow-y: auto;">
        <div style="padding: 1rem; border-bottom: 1px solid var(--border); font-weight: 600;">Recent Activity</div>
        <div id="notificationsList" style="padding: 0.5rem;">
            <p style="padding: 1rem; color: var(--text-muted); text-align:center;">Loading...</p>
        </div>
    </div>

    <script src="script.js"></script>
    <script src="ngo-partners.js"></script>
</body>
</html>
